<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice — Ledger Studio</title>
<meta name="description" content="View and download this invoice.">
<meta name="theme-color" content="#11122E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&display=block">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="public-invoice-page">
  <div class="public-invoice-wrap">

    <div class="public-invoice-topbar">
      <a href="index.html" class="logo"><span class="logo-mark" aria-hidden="true">L</span>Ledger Studio</a>
      <div class="public-invoice-actions" id="publicActions" style="display:none;">
        <button class="theme-switch" id="themeSwitch" aria-label="Dark mode" aria-pressed="false"><span class="knob" aria-hidden="true"></span></button>
        <button class="btn btn-ghost btn-sm" id="printBtn"><span class="ms" aria-hidden="true">print</span>Print</button>
        <button class="btn btn-primary btn-sm" id="downloadPdfBtn"><span class="ms" aria-hidden="true">download</span>Download PDF</button>
      </div>
    </div>

    <h1 class="sr-only">Invoice</h1>
    <div id="invoiceContainer"></div>

    <div class="invalid-link" id="invalidState" style="display:none;">
      <div class="ic"><span class="ms" aria-hidden="true">link_off</span></div>
      <h3>This invoice link isn't valid</h3>
      <p style="margin-top:10px;">The link may be incomplete, or it may have been copied incorrectly. Ask the sender to share it again.</p>
      <a href="index.html" class="btn btn-ghost btn-sm" style="margin-top:24px;">Go to Ledger Studio</a>
    </div>

    <div class="public-invoice-footer" id="publicFooter" style="display:none;">
      Sent with <a href="index.html">Ledger Studio</a>. Create your own invoices in minutes.
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="script.js"></script>
<script src="invoice-view.js"></script>
</body>
</html>
